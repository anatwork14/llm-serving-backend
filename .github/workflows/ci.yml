name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip ruff pytest pytest-asyncio pydantic pydantic-settings

      - name: Lint
        run: ruff check app tests

      - name: Compile
        run: python -m compileall -q app

      - name: Unit tests
        run: python -m pytest -q
