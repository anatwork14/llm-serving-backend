services:
  llm:
    build:
      context: .
      dockerfile: docker/llm.Dockerfile
      args:
        PRISM_LLAMA_TAG: ${PRISM_LLAMA_TAG:-prism-b10709-9a9394a}
        PRISM_CUDA_VERSION: ${PRISM_CUDA_VERSION:-12.4}
    gpus: all
    environment:
      HF_MODEL_REPO: ${HF_MODEL_REPO:-prism-ml/Ternary-Bonsai-2-27B-gguf}
      MODEL_FILE: ${MODEL_FILE:-Ternary-Bonsai-2-27B-PQ2_0.gguf}
      MMPROJ_FILE: ${MMPROJ_FILE:-Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf}
      HF_TOKEN: ${HF_TOKEN:-}
      LLM_CONTEXT_SIZE: ${LLM_CONTEXT_SIZE:-16384}
      LLM_GPU_LAYERS: ${LLM_GPU_LAYERS:-99}
      LLM_IMAGE_MAX_TOKENS: ${LLM_IMAGE_MAX_TOKENS:-1024}
      LLM_ENABLE_VISION: ${LLM_ENABLE_VISION:-true}
      LLAMA_API_KEY: ${LLAMA_API_KEY}
    volumes:
      - model-data:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45m
    restart: unless-stopped
    stop_grace_period: 30s

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-llm}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-llm} -d ${POSTGRES_DB:-llm}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      llm:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      ENABLE_OLLAMA_API: "False"
      ENABLE_OPENAI_API: "True"
      OPENAI_API_BASE_URL: http://backend:8000/v1
      OPENAI_API_KEY: ${BACKEND_API_KEY}
      ENABLE_FORWARD_USER_INFO_HEADERS: "True"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
    volumes:
      - open-webui-data:/app/backend/data
    restart: unless-stopped

volumes:
  model-data:
  postgres-data:
  open-webui-data:
